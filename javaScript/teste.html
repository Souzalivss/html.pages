<!DOCTYPE html>
<html lang="en">

<body>
<div id="d1">Conteúdo Original</div>
<button onclick="alterar()">CLIQUE AQUI</button>
<script>
    const alterar = () => {
        let d1 = document.getElementById("d1");
        d1.innerHTML="Conteudo alterado"
        d1.style.backgroundColor="yellow";
    }
</script>
</body>
</html>
