<!DOCTYPE html>
<html lang="en">
<head>
    <style>
 #container{
     background:#ccc;
     width:900px;
     margin:0 auto ;
     padding:10px;
 }
 .texto_destaque{
     font-weight:bold; <!-- negrito -->
 }
 ul li{
     list-style: none; <!-- tira a bolinha de lista -->
     margin-bottom:5px;
     display: inline; <!-- um ao lado do outro -->
 }
    </style>
</head>
<body>
    <div id="container">
        <h1>Titulo principal</h1>
        <p class="texto_destaque">Texto ao qual o titulo se refere</p>
        <ul>
            <li>Item 1</li>
            <li>Item 2</li>
            <li>Item 3</li>
            <li>Item 4</li>
        </ul>
    </div>
</body>
</html>
