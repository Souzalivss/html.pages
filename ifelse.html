<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<h2>Estrutura if else if</h2>
<p>Mdifica o com´primento de acordo com a hora do dia</p>
<p id="demo">Que horas são?</p>
<script>
    let painel = document.getElementById("demo");
    let hora = new Date().getHours();
    if (hora < 12) {
        painel.innerHTML = "bom dia";
    } else if (hora < 18){
        painel.innerHTML = "Boa Tarde";
    } else {painel.innerHTML = "Boa noite!"}

</script>
</body>
</html>
