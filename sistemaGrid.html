<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bootstrap Grid</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <style type="text/css">
        div{
            padding: 5px;
            color:#fff;
            font-weight: bold;
        }
        .border{
            border: 1px solid #999999;
        }
        .container{
            background: green;
        }
        .container-fluid{
            margin-top: 50px;
            background: orange;
        }
    </style>
</head>
<body>
<div class="container text-center">
    <div class="row">
    <div class="col border">
        Linha 1 - coluna 1
    </div>
    <div class="col border">
        Linha 1 - coluna 2
    </div>
        </div>
</div>
<div class="row">
    <div class="col border">
        Linha 2 - coluna 1
    </div>
    <div class="col border">
        Linha 2 - coluna 2
    </div>
    <div class="col border">
        Linha 2 - coluna 3
    </div>
</div>

<div class="container-fluid">
    <div class="row">
        <div class="col-4 border">
            linha 1 - coluna 2
        </div>
        <div class="col-8 border">
            Linha 1 - coluna 2  
        </div>
    </div>
    <div class="row">
        <div class="col-6 border">
            Linha 2 - coluna 1
        </div>
        <div class="col-3 border">
            Linha 2 - coluna 2
        </div>
        <div class="col-3 border">
            Linha 2 - coluna 3
        </div>
    </div>


</div>

</body>
</html>
