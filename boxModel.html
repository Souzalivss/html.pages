<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Box model em css</title>
    <style type="text/css">
        div{color:#fff; font-weight:bold; font-size: 20px;}
        #box_initial{
            width: 400px; height: 200px;
            background-color: red;
        }
        #box_exemplo{
            width: 400px; height: 200px;
            background-color: blue;
            margin-top: 30px;
            margin-bottom: 50px;
            margin-left: 15px;
            margin-right: 20px;
            padding: 50px;
            border: 10px solid black;
        }
        #box_final{
            width: 400px; height: 200px;
            background-color: green;
        }
    </style>
</head>
<body>
<div id="box_initial">Conteudo box initial</div>
<div id="box_exemplo">Conteudo box exemplo</div>
<div id="box_final">Conteudo box final</div>
</body>
</html>
